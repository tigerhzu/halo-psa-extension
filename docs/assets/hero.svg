 <rect x="56" y="338" width="160" height="36" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".13"/><text x="136" y="361" text-anchor="middle" fill="#c6d0df" font-size="13" font-weight="500">Vanilla JavaScript</text><rect x="232" y="338" width="160" height="36" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".13"/><text x="312" y="361" text-anchor="middle" fill="#c6d0df" font-size="13" font-weight="500">Manifest V3</text><rect x="408" y="338" width="160" height="36" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".13"/><text x="488" y="361" text-anchor="middle" fill="#c6d0df" font-size="13" font-weight="500">HaloPSA</text>
 <circle cx="996" cy="225" r="145" fill="none" stroke="#80d6b1" stroke-opacity=".18"/>
 <circle class="orbit" cx="996" cy="225" r="176" fill="none" stroke="#80d6b1" stroke-opacity=".28" stroke-dasharray="4 18"/>
