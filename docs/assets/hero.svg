<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="488" viewBox="0 0 1280 488" role="img" aria-labelledby="title desc">
<title id="title">Halo Companion — More room for the work that matters.</title><desc id="desc">A focused workspace for HaloPSA writing, tickets and timesheets.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#80d6b1" stop-opacity=".23"/><stop offset="1" stop-color="#80d6b1" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge"><stop stop-color="#80d6b1"/><stop offset="1" stop-color="#80d6b1" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a8b6ce" stroke-opacity=".065"/></pattern>
 <clipPath id="bounds"><rect width="1280" height="488" rx="24"/></clipPath>
</defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.orbit{transform-origin:996px 225px;animation:orbit 70s linear infinite}.glow{animation:breathe 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.55}}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.orbit,.glow,.pulse{animation:none}}</style>
<g clip-path="url(#bounds)">
