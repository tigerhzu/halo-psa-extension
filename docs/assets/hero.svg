 <text x="56" y="160" fill="#80d6b1" font-size="13" letter-spacing="3">COMPOSE / REVIEW / RESOLVE</text>
 <text x="52" y="237" fill="#f2f6ff" font-size="70" font-weight="700" letter-spacing="-3">Halo Companion</text>
