<!doctype html><html lang="zh-Hant" data-hpx-theme="cute-ios"><head><meta charset="utf-8"><title>Workbench browser regression</title>
<link rel="stylesheet" href="../src/styles/workbench.css"><link rel="stylesheet" href="../src/styles/toolbar.css"><link rel="stylesheet" href="../src/styles/modal.css"><link rel="stylesheet" href="../src/styles/settings-panel.css"><link rel="stylesheet" href="../src/styles/timesheet-align.css"><link rel="stylesheet" href="../src/styles/workbench-surfaces.css">
<style>/* Inspect settled appearance without transition timing. */ *,*::before,*::after { transition:none!important; }</style>
<script src="preview-runtime.js"></script></head><body>
<div id="halo-tree" style="width:200px"><div class="Select__control"><div class="Select__single-value">Selected team</div></div><div class="Select__menu"><div class="Select__menu-list"><div class="Select__option Select__option--is-focused">Team A</div></div></div></div>
<div><label>Note</label><div class="fr-box"><div id="editor" contenteditable="true">Original draft</div></div></div><button id="origin">Preview origin</button><pre id="result">Running…</pre>
<div class="hpx-ts-actions"><button type="button" class="hpx-ts-cancel">Cancel timesheet</button><button type="button" class="hpx-ts-apply">Apply timesheet</button></div>
<script src="../src/core/namespace.js"></script><script src="../src/config/selectors.js"></script><script src="../src/config/template-data.js"></script><script src="../src/config/ai-actions.js"></script><script src="../src/core/pet-registry.js"></script><script src="../src/ui/theme.js"></script><script src="../src/ui/preview-modal.js"></script><script src="../src/ui/settings-panel.js"></script>
<script>
const NS=window.__HPX;
NS.features.templates={list:()=>NS.config.templates,insert:()=>{}};
NS.features.aiRewrite={ACTIONS:NS.config.aiActions,run:()=>{}};
NS.features.noteWindow={open:()=>{}};
NS.core.petRegistry.discover=async()=>NS.core.petRegistry.builtIns();
chrome.storage.local.get=(key,callback)=>callback({hpx_settings:{theme:'cute-ios',accent:'#176b5b',petHidden:true,shortcutLinks:[{name:'Test link',url:'https://example.com'}]}});
</script><script src="../src/ui/toolbar.js"></script>
<script>
(async function(){
const checks=[];
function check(name,value){checks.push({name,ok:!!value});if(!value)throw new Error(name);}
function lum(color){let v=color.match(/[\d.]+/g).slice(0,3).map(Number);if(color.startsWith('color(srgb'))v=v.map(n=>n*255);v=v.map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4;});return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function clearControl(button,surface){const s=getComputedStyle(button);return contrast(s.color,s.backgroundColor)>=4.5&&contrast(s.borderTopColor,surface)>=3&&parseFloat(s.borderTopWidth)>=1;}
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
try {
check('native select menu stays opaque',getComputedStyle(document.querySelector('.Select__menu')).backgroundColor==='rgb(255, 255, 255)');
check('native select control stays opaque',getComputedStyle(document.querySelector('.Select__control')).backgroundColor==='rgb(255, 255, 255)');
check('focused native option is distinct',getComputedStyle(document.querySelector('.Select__option')).backgroundColor!==getComputedStyle(document.querySelector('.Select__menu')).backgroundColor);
NS.ui.theme.applyAppearance({theme:'default',accent:'#ffffff'});
check('white accent gets dark foreground',document.documentElement.style.getPropertyValue('--hpx-accent-ink')==='#000000');
NS.ui.theme.applyAppearance({theme:'default',accent:'#000000'});
check('black accent gets light foreground',document.documentElement.style.getPropertyValue('--hpx-accent-ink')==='#ffffff');
const editor=document.getElementById('editor'); NS.ui.toolbar.mount(editor);NS.ui.toolbar.mount(editor);
check('remount does not duplicate toolbar',document.querySelectorAll('.hpx-toolbar').length===1);
const aiButton=document.querySelector('.hpx-tb-btn:not(.hpx-tb-btn--window)');
check('AI controls have readable text and visible boundaries',clearControl(aiButton,'rgb(255,255,255)'));
check('AI controls use solid fills without a whitening gradient',getComputedStyle(aiButton).backgroundImage==='none');
NS.ui.theme.applyAppearance({theme:'cute-ios',accent:'#ffffff'});
check('white-accent primary controls retain a visible boundary',clearControl(document.querySelector('.hpx-tb-btn--window'),'rgb(255,255,255)'));
check('white-accent timesheet Apply retains a visible boundary',clearControl(document.querySelector('.hpx-ts-apply'),'rgb(255,255,255)'));
check('timesheet Cancel remains clearly visible',clearControl(document.querySelector('.hpx-ts-cancel'),'rgb(255,255,255)'));
const toggle=document.querySelector('.hpx-tb-btn--template'); toggle.click();
check('template reports expanded state',toggle.getAttribute('aria-expanded')==='true');
toggle.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
check('arrow key focuses first template',document.activeElement.getAttribute('role')==='menuitem');
document.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
check('escape closes template and restores focus',toggle.getAttribute('aria-expanded')==='false'&&document.activeElement===toggle);
NS.ui.settingsPanel.start(); await frame();await frame();
const links=document.querySelector('[data-hpx-sidebar-control="links"]');
check('shortcut entry works without visible pet',!!links&&document.querySelector('.hpx-sp-pet').hidden);
check('dock controls have visible boundaries and readable text',clearControl(links,'rgb(255,255,255)'));
check('dock surface stays opaque and unblurred',getComputedStyle(links.parentElement).backgroundColor==='rgb(255, 255, 255)'&&getComputedStyle(links.parentElement).backdropFilter==='none');
links.click();await frame();await frame();
const row=document.querySelector('.hpx-sidebar-popover .hpx-sp-shortcut-row');
check('closed shortcut editor is really hidden',row.hidden&&getComputedStyle(row).display==='none');
document.querySelector('.hpx-sp-shortcut-edit').click();
check('edit reveals shortcut fields',!row.hidden&&getComputedStyle(row).display!=='none');
document.querySelector('.hpx-sp-shortcut-cancel').click();
check('cancel hides fields again',row.hidden&&getComputedStyle(row).display==='none');
document.querySelector('.hpx-sidebar-popover').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
check('popover escape restores trigger',!document.querySelector('.hpx-sidebar-popover')&&document.activeElement===links);
const origin=document.getElementById('origin');origin.focus();
const outcome=NS.ui.previewModal.open({original:'Original',result:'Revised'});await new Promise(resolve=>setTimeout(resolve,0));
const modal=document.querySelector('.hpx-modal');
check('preview has modal semantics',modal.getAttribute('aria-modal')==='true'&&modal.getAttribute('role')==='dialog');
check('preview secondary action remains clearly visible',clearControl(modal.querySelector('.hpx-btn--secondary'),'rgb(255,255,255)'));
const confirm=modal.querySelector('.hpx-btn--primary');confirm.focus();confirm.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));
check('preview focus cycles within dialog',document.activeElement===modal.querySelector('.hpx-modal__close'));
modal.querySelector('.hpx-modal__textarea:not(.hpx-modal__textarea--readonly)').value='Edited result';confirm.click();
check('apply returns explicitly reviewed text',await outcome==='Edited result');
check('preview returns focus to origin',document.activeElement===origin);
check('shared preview never writes editor directly',editor.textContent==='Original draft');
} catch(error) {checks.push({name:error.message,ok:false});}
const result={ok:checks.every(x=>x.ok),passed:checks.filter(x=>x.ok).length,total:checks.length,checks};
document.body.setAttribute('data-ok',String(result.ok));document.getElementById('result').textContent=JSON.stringify(result,null,2);document.title=(result.ok?'PASS':'FAIL')+' · Workbench browser regression';
})();
</script></body></html>
