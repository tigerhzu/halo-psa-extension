<!doctype html><html><head><meta charset="utf-8"><title>Synthetic Halo performance fixture</title>
<style>
body{margin:0;font:14px sans-serif}#app-nav-menu{position:fixed;left:0;top:0;width:60px;height:100vh}
#halo-tree{position:fixed;left:60px;top:0;width:220px;height:100vh}main{margin-left:300px}
.ticket-row{display:flex;height:26px}.ticket-row>div{width:160px}.treeviewnode{height:28px}
</style></head><body><nav id="app-nav-menu"><a href="/timesheet"><span class="app-button-img"></span>Timesheets</a></nav>
<aside id="halo-tree"><ul><li><div class="treeviewnode" data-level="1" data-id="1"><span class="nodetitle">Op Team A</span></div></li></ul></aside>
<main id="main"><h1>Tickets</h1><div id="rows"></div></main>
<script>
(async function () {
  const params = new URLSearchParams(location.search), mode = params.get('mode');
  const metrics = { queries: 0, geometryReads: 0, styleReads: 0, observerCallbacks: 0, observerMs: 0 };
  const errors = [];
  addEventListener('error', e => errors.push(e.message));
  addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
  for (const proto of [Document.prototype, Element.prototype]) for (const key of ['querySelector', 'querySelectorAll']) {
    const original = proto[key]; proto[key] = function (...args) { metrics.queries++; return original.apply(this, args); };
  }
  const bounds = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () { metrics.geometryReads++; return bounds.call(this); };
  const computed = window.getComputedStyle;
  window.getComputedStyle = function (...args) { metrics.styleReads++; return computed.apply(this, args); };
  const Observer = window.MutationObserver;
  window.MutationObserver = class extends Observer {
    constructor(fn) { super((...args) => { const start = performance.now(); metrics.observerCallbacks++; try { return fn(...args); } finally { metrics.observerMs += performance.now() - start; } }); }
  };
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const settings = { theme: 'cute-ios', accent: '#ff7a1a', opacity: 55, wash: 'ocean', washIntensity: 42,
    petHidden: true, ultimateMode: params.get('ultimate') === '1', onboardingVersion: 99 };
  const changed = [];
  window.chrome = {
    storage: { local: {
      get(key, cb) { const data = { hpx_settings: settings }; if (cb) queueMicrotask(() => cb(data)); else return Promise.resolve(data); },
      set(data, cb) { const oldValue = { ...settings }; Object.assign(settings, data.hpx_settings); queueMicrotask(() => { changed.forEach(fn => fn({hpx_settings:{oldValue,newValue:{...settings}}},'local')); if(cb)cb(); }); }
    }, onChanged: { addListener(fn) { changed.push(fn); } } },
    runtime: { getURL: path => '/runtime/' + path, lastError: null, onMessage: { addListener() {} },
      sendMessage(message, cb) { const result = {ok:true,enabled:false}; if(cb)queueMicrotask(()=>cb(result)); else return Promise.resolve(result); },
      getPackageDirectoryEntry(cb) { cb({getDirectory(name, opts, success, fail) { fail(Error('No custom packages in fixture')); }}); }
    }
  };
  const script = src => new Promise((resolve, reject) => { const node = document.createElement('script'); node.src = src; node.onload = resolve; node.onerror = () => reject(Error(src)); document.head.append(node); });
  const manifest = await (await fetch('/runtime/manifest.json')).json();
  // Runtime modules and CSS are real; browser storage and Halo backend are synthetic.
  if (mode !== 'native') {
    for (const group of manifest.content_scripts) for (const href of group.css || []) {
      const node = document.createElement('link'); node.rel = 'stylesheet'; node.href = '/runtime/' + href; document.head.append(node);
    }
    await script('/bundle.js');
  }
  const before = performance.now();
  const rows = document.getElementById('rows');
  for (let batch = 0; batch < 20; batch++) {
    const fragment = document.createDocumentFragment();
    for (let row = 0; row < 100; row++) {
      const node = document.createElement('div'); node.className = 'ticket-row list-panel';
      node.innerHTML = '<div class="column"><span class="icon">●</span>Ticket ' + (batch*100+row) + '</div><div class="list-cell">Assigned</div><div class="panel-label">Open</div>';
      fragment.append(node);
    }
    rows.append(fragment);
    await sleep(30);
  }
  const renderMs = performance.now() - before;
  await sleep(1800);
  const startup = {...metrics}, idleBefore = {...metrics};
  await sleep(1000);
  const idle = Object.fromEntries(Object.keys(metrics).map(k => [k, metrics[k]-idleBefore[k]]));
  // Decorative extension animation should never cause full-page native discovery.
  const pet = document.createElement('div'); pet.className = 'hpx-sp-pet'; document.body.append(pet);
  const animationBefore = {...metrics};
  for (let i=0;i<20;i++) { pet.style.backgroundPosition = i+'px 0px'; await sleep(20); }
  await sleep(350);
  const animation = Object.fromEntries(Object.keys(metrics).map(k => [k, metrics[k]-animationBefore[k]]));
  window.__benchmarkResult = {mode,ultimate:settings.ultimateMode,rows:2000,renderMs,startup,idle,animation,errors};
})().catch(error => { window.__benchmarkResult = {errors:[String(error.stack)]}; });
</script></body></html>
